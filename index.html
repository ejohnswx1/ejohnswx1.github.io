<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RRFS 3km Interactive Cross-Section Tool</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f6f9;
      color: #212529;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    h2 { margin-top: 0; }
    #map {
      height: 480px;
      width: 100%;
      border: 1px solid #ced4da;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .controls {
      margin: 14px 0;
      padding: 12px;
      background: white;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    button, select {
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #adb5bd;
      background: white;
      cursor: pointer;
    }
    button:hover:not(:disabled) {
      background: #e9ecef;
    }
    #plotBtn {
      background: #0d6efd;
      color: white;
      border-color: #0d6efd;
      font-weight: 600;
    }
    #plotBtn:hover:not(:disabled) {
      background: #0b5ed7;
    }
    #plotBtn:disabled {
      background: #9ec5fe;
      border-color: #9ec5fe;
      cursor: not-allowed;
    }
    #clearBtn {
      background: #f8d7da;
      border-color: #f1aeb5;
      color: #58151c;
    }
    #clearBtn:hover {
      background: #f1aeb5;
    }
    .fhour-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    #coordsLabel {
      font-family: monospace;
      font-size: 13px;
      color: #495057;
    }
    #statusMsg {
      font-weight: 500;
      color: #0d6efd;
      margin: 10px 0;
      min-height: 20px;
    }
    #statusMsg.error {
      color: #dc3545;
      white-space: pre-wrap;
      font-family: monospace;
      background: #fff;
      padding: 12px;
      border: 1px solid #f5c2c7;
      border-radius: 6px;
    }
    #output img {
      width: 100%;
      margin-top: 10px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>RRFS 3km Interactive Cross-Section</h2>
    <p>Click two points on the map to draw a transect. Drag either marker to adjust endpoints.</p>

    <div id="map"></div>

    <div class="controls">
      <button type="button" id="plotBtn" disabled>Generate Cross-Section</button>
      <button type="button" id="clearBtn">Clear Line</button>

      <label for="runSelect"><strong>Model Run:</strong></label>
      <select id="runSelect">
        <option value="latest" selected>Latest Available</option>
      </select>

      <div class="fhour-group">
        <label for="fhourSelect"><strong>Forecast Hour:</strong></label>
        <button type="button" id="prevHourBtn" title="Previous Forecast Hour">&larr;</button>
        <select id="fhourSelect"></select>
        <button type="button" id="nextHourBtn" title="Next Forecast Hour">&rarr;</button>
      </div>

      <label for="ymaxSelect"><strong>Ceiling:</strong></label>
      <select id="ymaxSelect">
        <option value="12000">12 km (Upper Troposphere)</option>
        <option value="10000" selected>10 km (Standard)</option>
        <option value="6000">6 km (Mid-Levels)</option>
        <option value="3000">3 km (Boundary Layer)</option>
      </select>

      <span id="coordsLabel">Endpoints: Click 2 points on the map</span>
    </div>

    <div id="statusMsg"></div>
    <div id="output"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const CGI_URL = "/api/cross_section";

    // 1. Populate Model Run dropdown with the last 8 synoptic cycles (00Z, 06Z, 12Z, 18Z)
    const runSelect = document.getElementById('runSelect');
    const now = new Date();
    const latestSynopticHour = Math.floor(now.getUTCHours() / 6) * 6;
    const baseCycle = new Date(Date.UTC(
      now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), latestSynopticHour, 0, 0
    ));

    for (let i = 0; i < 8; i++) {
      const dt = new Date(baseCycle.getTime() - i * 6 * 3600 * 1000);
      const yyyy = dt.getUTCFullYear();
      const mm = String(dt.getUTCMonth() + 1).padStart(2, '0');
      const dd = String(dt.getUTCDate()).padStart(2, '0');
      const hh = String(dt.getUTCHours()).padStart(2, '0');

      const opt = document.createElement('option');
      opt.value = `${yyyy}${mm}${dd}_${hh}`;
      opt.textContent = `${yyyy}-${mm}-${dd} ${hh}Z`;
      runSelect.appendChild(opt);
    }

    // 2. Populate Forecast Hour dropdown (F000 through F084, defaulting to F001)
    const fhourSelect = document.getElementById('fhourSelect');
    for (let h = 0; h <= 84; h++) {
      const opt = document.createElement('option');
      opt.value = h;
      opt.textContent = `F${String(h).padStart(3, '0')}`;
      if (h === 1) opt.selected = true;
      fhourSelect.appendChild(opt);
    }

    const map = L.map('map').setView([35.5, -90.0], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 14,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let markers = [];
    let polyline = L.polyline([], { color: '#dc3545', weight: 3.5 }).addTo(map);

    function updateLine() {
      const latlngs = markers.map(m => m.getLatLng());
      polyline.setLatLngs(latlngs);

      if (latlngs.length === 2) {
        const [p1, p2] = latlngs;
        document.getElementById('coordsLabel').textContent =
          `Start: (${p1.lat.toFixed(4)}, ${p1.lng.toFixed(4)}) → End: (${p2.lat.toFixed(4)}, ${p2.lng.toFixed(4)})`;
        document.getElementById('plotBtn').disabled = false;
      } else {
        document.getElementById('coordsLabel').textContent =
          `Endpoints: Click ${2 - latlngs.length} more point(s)`;
        document.getElementById('plotBtn').disabled = true;
      }
    }

    map.on('click', (e) => {
      if (markers.length >= 2) return;
      const marker = L.marker(e.latlng, { draggable: true }).addTo(map);
      marker.bindTooltip(markers.length === 0 ? "Start" : "End", { permanent: true, direction: "top" });
      marker.on('drag', updateLine);
      markers.push(marker);
      updateLine();
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      updateLine();
      const statusEl = document.getElementById('statusMsg');
      const outputEl = document.getElementById('output');
      const existingImg = outputEl.querySelector('img');
      if (existingImg && existingImg.dataset.blobUrl) {
        URL.revokeObjectURL(existingImg.dataset.blobUrl);
      }
      statusEl.textContent = '';
      statusEl.className = '';
      outputEl.innerHTML = '';
    });

    async function generateCrossSection() {
      if (markers.length !== 2) return;

      const [p1, p2] = markers.map(m => m.getLatLng());
      const ymax = document.getElementById('ymaxSelect').value;
      const fhour = fhourSelect.value;
      const runVal = runSelect.value;
      const statusEl = document.getElementById('statusMsg');
      const outputEl = document.getElementById('output');
      const plotBtn = document.getElementById('plotBtn');

      const query = new URLSearchParams({
        lat1: p1.lat.toFixed(4),
        lon1: p1.lng.toFixed(4),
        lat2: p2.lat.toFixed(4),
        lon2: p2.lng.toFixed(4),
        ymax: ymax,
        fhour: fhour,
        run: runVal,
        _t: Date.now()
      });

      plotBtn.disabled = true;
      statusEl.className = '';
      const runLabel = runVal === 'latest' ? 'Latest' : runVal.replace('_', ' ') + 'Z';
      statusEl.textContent = `Generating RRFS [${runLabel}] F${String(fhour).padStart(3, '0')} cross-section...`;

      try {
        const response = await fetch(`${CGI_URL}?${query.toString()}`);
        const contentType = response.headers.get("Content-Type") || "";
        if (!response.ok || !contentType.includes("image/png")) {
          const errText = await response.text();
          throw new Error(`API Error:\n${errText}`);
        }
        const blob = await response.blob();
        const imgUrl = URL.createObjectURL(blob);
        const scrollY = window.scrollY;

        let imgEl = outputEl.querySelector('img');
        if (!imgEl) {
          imgEl = document.createElement('img');
          imgEl.alt = 'RRFS Cross-Section';
          outputEl.appendChild(imgEl);
        }

        const prevUrl = imgEl.dataset.blobUrl;
        imgEl.onload = () => {
          if (prevUrl) URL.revokeObjectURL(prevUrl);
          window.scrollTo(0, scrollY);
        };
        imgEl.dataset.blobUrl = imgUrl;
        imgEl.src = imgUrl;
        statusEl.textContent = '';
      } catch (err) {
        statusEl.className = 'error';
        statusEl.textContent = err.message;
      } finally {
        plotBtn.disabled = false;
      }
    }

    document.getElementById('plotBtn').addEventListener('click', generateCrossSection);
    runSelect.addEventListener('change', generateCrossSection);
    fhourSelect.addEventListener('change', generateCrossSection);
    document.getElementById('ymaxSelect').addEventListener('change', generateCrossSection);

    document.getElementById('prevHourBtn').addEventListener('click', () => {
      if (fhourSelect.selectedIndex > 0) {
        fhourSelect.selectedIndex -= 1;
        generateCrossSection();
      }
    });

    document.getElementById('nextHourBtn').addEventListener('click', () => {
      if (fhourSelect.selectedIndex < fhourSelect.options.length - 1) {
        fhourSelect.selectedIndex += 1;
        generateCrossSection();
      }
    });
  </script>
</body>
</html>
